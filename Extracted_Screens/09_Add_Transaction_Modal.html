<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Moneta Trail - Add Transaction</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-background": "#0b1c30",
                        "tertiary-fixed-dim": "#adc6ff",
                        "on-secondary-fixed-variant": "#930013",
                        "on-error-container": "#93000a",
                        "surface-container": "#e5eeff",
                        "surface-tint": "#006c49",
                        "on-tertiary-fixed-variant": "#004395",
                        "surface-container-highest": "#d3e4fe",
                        "tertiary-container": "#71a1ff",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#10b981",
                        "on-primary-container": "#00422b",
                        "secondary-container": "#da3437",
                        "tertiary": "#005ac2",
                        "primary-fixed-dim": "#4edea3",
                        "on-tertiary-container": "#00367a",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#410004",
                        "primary": "#006c49",
                        "surface-container-high": "#dce9ff",
                        "secondary-fixed-dim": "#ffb3ad",
                        "inverse-primary": "#4edea3",
                        "on-tertiary": "#ffffff",
                        "outline": "#6c7a71",
                        "inverse-surface": "#213145",
                        "on-primary-fixed": "#002113",
                        "error": "#ba1a1a",
                        "surface-bright": "#f8f9ff",
                        "surface": "#f8f9ff",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "secondary": "#b61722",
                        "tertiary-fixed": "#d8e2ff",
                        "on-surface-variant": "#3c4a42",
                        "surface-container-low": "#eff4ff",
                        "outline-variant": "#bbcabf",
                        "on-tertiary-fixed": "#001a42",
                        "inverse-on-surface": "#eaf1ff",
                        "on-error": "#ffffff",
                        "primary-fixed": "#6ffbbe",
                        "background": "#f8f9ff",
                        "secondary-fixed": "#ffdad7",
                        "on-primary-fixed-variant": "#005236",
                        "on-surface": "#0b1c30",
                        "on-secondary-container": "#fffbff",
                        "surface-variant": "#d3e4fe",
                        "surface-dim": "#cbdbf5"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    spacing: {
                        gutter: "16px",
                        "margin-mobile": "16px",
                        "margin-desktop": "24px",
                        base: "4px",
                        "card-padding": "20px"
                    },
                    fontFamily: {
                        "label-caps": ["Inter"],
                        "display-hero-mobile": ["Inter"],
                        "numeric-data": ["Inter"],
                        "display-hero": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    fontSize: {
                        "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
                        "display-hero-mobile": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "numeric-data": ["18px", { lineHeight: "24px", fontWeight: "600" }],
                        "display-hero": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "headline-md": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }]
                    },
                    boxShadow: {
                        'level-1': '0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
                        'level-2': '0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04)',
                    }
                }
            }
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
            .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<!-- TopAppBar -->
<header class="bg-surface docked full-width top-0 sticky z-50 flat no shadows flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-2 h-[64px]">
<button class="text-on-surface-variant p-2 rounded-full hover:bg-surface-container active:scale-95 transition-transform duration-200 flex items-center justify-center w-10 h-10">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="text-headline-md font-headline-md text-on-surface">Add Transaction</h1>
<button class="text-primary font-label-caps text-label-caps uppercase px-4 py-2 rounded-full hover:bg-surface-container active:scale-95 transition-transform duration-200">
            Save
        </button>
</header>
<main class="flex-grow flex flex-col px-margin-mobile md:px-margin-desktop pb-24 max-w-2xl mx-auto w-full">
<!-- Segmented Control -->
<div class="mt-4 bg-surface-container rounded-full p-1 flex relative">
<!-- Active Indicator (Placeholder logic) -->
<div class="absolute inset-y-1 left-1 w-[calc(33.33%-4px)] bg-surface-container-lowest rounded-full shadow-sm transition-all duration-300"></div>
<button class="flex-1 py-2 text-center text-label-caps font-label-caps text-on-surface z-10 relative">Income</button>
<button class="flex-1 py-2 text-center text-label-caps font-label-caps text-on-surface-variant z-10 relative">Expense</button>
<button class="flex-1 py-2 text-center text-label-caps font-label-caps text-on-surface-variant z-10 relative">Transfer</button>
</div>
<!-- Numeric Display -->
<div class="mt-8 flex flex-col items-center justify-center">
<span class="text-body-sm font-body-sm text-on-surface-variant mb-1">Amount</span>
<div class="text-display-hero-mobile font-display-hero-mobile md:text-display-hero md:font-display-hero text-on-background flex items-center gap-1">
<span class="text-on-surface-variant">$</span>
<span>0.00</span>
</div>
</div>
<!-- Pickers & Inputs -->
<div class="mt-8 space-y-4">
<!-- Side-by-side Pickers -->
<div class="flex gap-4">
<div class="flex-1 bg-surface-container-lowest rounded-xl p-card-padding shadow-level-1 cursor-pointer flex flex-col items-center justify-center gap-2 hover:bg-surface-container-highest transition-colors">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="account_balance">account_balance</span>
</div>
<span class="text-label-caps font-label-caps text-on-surface">Select Account</span>
</div>
<div class="flex-1 bg-surface-container-lowest rounded-xl p-card-padding shadow-level-1 cursor-pointer flex flex-col items-center justify-center gap-2 hover:bg-surface-container-highest transition-colors">
<div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="category">category</span>
</div>
<span class="text-label-caps font-label-caps text-on-surface">Select Category</span>
</div>
</div>
<!-- Notes Field -->
<div class="bg-surface-container-lowest rounded-xl p-3 shadow-level-1 flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="notes">notes</span>
<input class="flex-1 bg-transparent border-none focus:ring-0 text-body-lg font-body-lg placeholder-on-surface-variant text-on-background p-0" placeholder="Add notes..." type="text"/>
</div>
<!-- Date/Time Selector -->
<div class="bg-surface-container-lowest rounded-xl p-3 shadow-level-1 flex justify-between items-center cursor-pointer hover:bg-surface-container-highest transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="calendar_today">calendar_today</span>
<span class="text-body-lg font-body-lg text-on-background">Today, 2:30 PM</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</div>
</div>
<!-- Spacer -->
<div class="flex-grow"></div>
<!-- Keypad -->
<div class="mt-8 bg-surface-container-lowest rounded-xl shadow-level-1 p-2">
<div class="grid grid-cols-4 gap-2">
<!-- Row 1 -->
<button class="bg-surface hover:bg-surface-container rounded-lg h-14 flex items-center justify-center text-numeric-data font-numeric-data text-on-surface active:scale-95 transition-all">7</button>
<button class="bg-surface hover:bg-surface-container rounded-lg h-14 flex items-center justify-center text-numeric-data font-numeric-data text-on-surface active:scale-95 transition-all">8</button>
<button class="bg-surface hover:bg-surface-container rounded-lg h-14 flex items-center justify-center text-numeric-data font-numeric-data text-on-surface active:scale-95 transition-all">9</button>
<button class="bg-surface-container hover:bg-surface-container-highest rounded-lg h-14 flex items-center justify-center text-on-surface-variant active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="backspace">backspace</span>
</button>
<!-- Row 2 -->
<button class="bg-surface hover:bg-surface-container rounded-lg h-14 flex items-center justify-center text-numeric-data font-numeric-data text-on-surface active:scale-95 transition-all">4</button>
<button class="bg-surface hover:bg-surface-container rounded-lg h-14 flex items-center justify-center text-numeric-data font-numeric-data text-on-surface active:scale-95 transition-all">5</button>
<button class="bg-surface hover:bg-surface-container rounded-lg h-14 flex items-center justify-center text-numeric-data font-numeric-data text-on-surface active:scale-95 transition-all">6</button>
<button class="bg-surface-container hover:bg-surface-container-highest rounded-lg h-14 flex items-center justify-center text-numeric-data font-numeric-data text-on-surface-variant active:scale-95 transition-all">+</button>
<!-- Row 3 -->
<button class="bg-surface hover:bg-surface-container rounded-lg h-14 flex items-center justify-center text-numeric-data font-numeric-data text-on-surface active:scale-95 transition-all">1</button>
<button class="bg-surface hover:bg-surface-container rounded-lg h-14 flex items-center justify-center text-numeric-data font-numeric-data text-on-surface active:scale-95 transition-all">2</button>
<button class="bg-surface hover:bg-surface-container rounded-lg h-14 flex items-center justify-center text-numeric-data font-numeric-data text-on-surface active:scale-95 transition-all">3</button>
<button class="bg-surface-container hover:bg-surface-container-highest rounded-lg h-14 flex items-center justify-center text-numeric-data font-numeric-data text-on-surface-variant active:scale-95 transition-all">-</button>
<!-- Row 4 -->
<button class="bg-surface hover:bg-surface-container rounded-lg h-14 flex items-center justify-center text-numeric-data font-numeric-data text-on-surface active:scale-95 transition-all">.</button>
<button class="bg-surface hover:bg-surface-container rounded-lg h-14 flex items-center justify-center text-numeric-data font-numeric-data text-on-surface active:scale-95 transition-all">0</button>
<button class="bg-primary text-on-primary hover:bg-surface-tint rounded-lg h-14 flex items-center justify-center text-numeric-data font-numeric-data active:scale-95 transition-all col-span-2">=</button>
</div>
</div>
</main>
<!-- Suppressed Bottom Navigation for Transactional Screen as per rules -->
</body></html>
