                            <div className="w-full h-1 bg-surface-container rounded-full overflow-hidden mt-4">

                                        <div>

                                <h2 className="text-label-caps text-on-surface-variant tracking-widest uppercase">Yesterday</h2>
                                <span className="text-body-sm text-on-surface-variant">+$2,500.00</span>
