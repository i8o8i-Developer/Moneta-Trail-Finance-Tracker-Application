<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Moneta Traile - Splash Screen</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config injected from system prompt -->

            darkMode: "class",

                extend: {
                    "colors": {

                        "on-background": "#0b1c30",
                        "surface-container": "#e5eeff",
                        "tertiary-fixed-dim": "#adc6ff",
                        "tertiary-fixed": "#d8e2ff",
                        "on-surface-variant": "#3c4a42",
                        "on-tertiary-fixed": "#001a42",
                        "surface-tint": "#006c49",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-container-high": "#dce9ff",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed-variant": "#930013",
                        "on-surface": "#0b1c30",
                        "surface-variant": "#d3e4fe",
                        "secondary-fixed": "#ffdad7",
                        "surface": "#f8f9ff",
                        "on-tertiary-fixed-variant": "#004395",
                        "tertiary": "#005ac2",
                        "on-primary-fixed": "#002113",
                        "outline-variant": "#bbcabf",
                        "error": "#ba1a1a",
                        "tertiary-container": "#71a1ff",
                        "on-primary-fixed-variant": "#005236",
                        "secondary": "#b61722",
                        "secondary-fixed-dim": "#ffb3ad",
                        "on-secondary-fixed": "#410004",
                        "surface-container-low": "#eff4ff",
                        "primary-container": "#10b981",
                        "secondary-container": "#da3437",
                        "error-container": "#ffdad6",
                        "primary": "#006c49",
                        "on-tertiary-container": "#00367a",
                        "surface-dim": "#cbdbf5",
                        "surface-bright": "#f8f9ff",
                        "on-error": "#ffffff",
                        "inverse-surface": "#213145",
                        "on-secondary-container": "#fffbff",
                        "on-primary": "#ffffff",
                        "background": "#f8f9ff",
                        "primary-fixed": "#6ffbbe",
                        "inverse-primary": "#4edea3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "margin-mobile": "16px",
                        "card-padding": "20px",
                        "base": "4px",
                        "margin-desktop": "24px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "display-hero": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-sm": ["Inter"],
                        "display-hero-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "numeric-data": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-hero": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],

                        "numeric-data": ["18px", { "lineHeight": "24px", "fontWeight": "600" }]

                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Entrance animation */
        @keyframes fade-slide-up {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-entrance {
            animation: fade-slide-up 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Minimal sliding progress */
        @keyframes slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }

        .animate-slide {
            animation: slide 1.5s infinite linear;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-surface-bright h-screen w-screen flex flex-col items-center justify-center overflow-hidden m-0 p-0 selection:bg-primary/20" style="transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1); opacity: 1;">
<!-- Main Content Container -->
<div class="flex-1 flex flex-col items-center justify-center w-full px-gutter relative z-10">
<!-- Brand Centerpiece -->
<div class="animate-entrance flex flex-col items-center">
<!-- Brand Name -->
<h1 class="font-display-hero-mobile md:font-display-hero text-center font-bold tracking-[0.05em] uppercase text-2xl md:text-3xl bg-gradient-to-r from-emerald-500 to-teal-500 bg-clip-text text-transparent">
                Moneta Traile
            </h1>
<!-- Subtle Tagline/Sub-brand -->
<p class="mt-4 font-body-lg text-body-lg text-on-surface-variant text-center max-w-[280px] tracking-wide font-light">
                Clarity In Capital.
            </p>
</div>
</div>
<!-- Loading State Area (Bottom fixed) -->
<div class="pb-16 md:pb-20 flex flex-col items-center w-full animate-entrance relative z-10 max-w-xs px-8" style="animation-delay: 0.5s;">
<!-- Minimal Progress Indicator -->
<div class="w-16 h-[1px] bg-outline-variant/30 rounded-full overflow-hidden mb-6 relative">
<div class="absolute top-0 left-0 h-full w-1/3 bg-primary rounded-full animate-slide"></div>
</div>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-[0.2em]">
            Syncing securely
        </p>
</div>


</body></html>
