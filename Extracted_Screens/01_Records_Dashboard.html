<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Moneta Trail - Records</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-background": "#0b1c30",

                      "primary-container": "#10b981",
                      "on-primary-container": "#00422b",
                      "secondary-container": "#da3437",
                      "tertiary": "#005ac2",
                      "primary-fixed-dim": "#4edea3",
                      "on-tertiary-container": "#00367a",
                      "on-primary": "#ffffff",
                      "on-secondary-fixed": "#410004",
                      "primary": "#006c49",
                      "surface-container-high": "#dce9ff",
                      "secondary-fixed-dim": "#ffb3ad",
                      "inverse-primary": "#4edea3",
                      "on-tertiary": "#ffffff",
                      "outline": "#6c7a71",
                      "inverse-surface": "#213145",
                      "on-primary-fixed": "#002113",
                      "error": "#ba1a1a",
                      "surface-bright": "#f8f9ff",
                      "surface": "#f8f9ff",
                      "error-container": "#ffdad6",
                      "on-secondary": "#ffffff",
                      "secondary": "#b61722",
                      "tertiary-fixed": "#d8e2ff",
                      "on-surface-variant": "#3c4a42",
                      "surface-container-low": "#eff4ff",
                      "outline-variant": "#bbcabf",
                      "on-tertiary-fixed": "#001a42",
                      "inverse-on-surface": "#eaf1ff",
                      "on-error": "#ffffff",
                      "primary-fixed": "#6ffbbe",
                      "background": "#f8f9ff",
                      "secondary-fixed": "#ffdad7",
                      "on-primary-fixed-variant": "#005236",
                      "on-surface": "#0b1c30",
                      "on-secondary-container": "#fffbff",
                      "surface-variant": "#d3e4fe",
                      "surface-dim": "#cbdbf5"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "16px",
                      "margin-mobile": "16px",
                      "margin-desktop": "24px",
                      "base": "4px",
                      "card-padding": "20px"
              },
              "fontFamily": {
                      "label-caps": [
                              "Inter"
                      ],
                      "display-hero-mobile": [
                              "Inter"
                      ],
                      "numeric-data": [

                      ],
                      "display-hero": [
                              "Inter"
                      ],
                      "headline-md": [
                              "Inter"
                      ],
                      "body-lg": [

                      ],
                      "body-sm": [

                      ]
              },
              "fontSize": {
                      "label-caps": [
                              "12px",
                              {
                                      "lineHeight": "16px",

                      ],
                      "display-hero-mobile": [

                      "display-hero": [

                      ],
                      "headline-md": [
                              "20px",

                                      "lineHeight": "28px",
                                      "fontWeight": "600"

                      ],
                      "body-lg": [

                      "body-sm": [

                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "400"

                      ]
              }
      },
          },
        }
      </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .shadow-ambient {
            box-shadow: 0px 4px 24px rgba(11, 28, 48, 0.06);
        }
        
        .shadow-fab {
            box-shadow: 0px 8px 32px rgba(0, 108, 73, 0.25);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-lg text-body-lg min-h-screen flex flex-col pt-[56px] pb-[80px]">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface text-primary flex justify-between items-center px-margin-mobile md:px-margin-desktop py-2 h-[56px] flat no shadows">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="text-headline-md font-headline-md text-on-surface font-extrabold tracking-tight">Moneta Trail</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container text-primary transition-colors" onclick="location.href='/settings'">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</header>
<main class="flex-grow px-margin-mobile md:px-margin-desktop md:max-w-4xl mx-auto w-full pt-4">
<!-- Month Switcher -->
<div class="flex items-center justify-center space-x-6 mb-8">
<button class="w-8 h-8 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<div class="text-headline-md font-headline-md text-on-surface w-40 text-center">October 2023</div>
<button class="w-8 h-8 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
<!-- Summary Row -->
<div class="grid grid-cols-3 gap-4 mb-10">
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-ambient flex flex-col items-center">
<div class="text-body-sm font-body-sm text-on-surface-variant mb-1">Expense</div>
<div class="text-numeric-data font-numeric-data text-secondary">-$1,200</div>
</div>
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-ambient flex flex-col items-center">
<div class="text-body-sm font-body-sm text-on-surface-variant mb-1">Income</div>
<div class="text-numeric-data font-numeric-data text-primary">+$3,500</div>
</div>
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-ambient flex flex-col items-center relative overflow-hidden">
<div class="absolute inset-0 bg-primary/5 pointer-events-none"></div>
<div class="text-body-sm font-body-sm text-on-surface-variant mb-1 relative z-10">Total Balance</div>
<div class="text-numeric-data font-numeric-data text-on-surface relative z-10">$2,300</div>
</div>
</div>
<!-- Transaction List -->
<div class="space-y-8">
<!-- Date Group: Today -->
<div>
<div class="flex justify-between items-end mb-4 border-b border-surface-container-highest pb-2">
<h2 class="text-label-caps font-label-caps text-on-surface-variant tracking-widest uppercase">Today</h2>
<span class="text-body-sm font-body-sm text-on-surface-variant">-$45.00</span>
</div>
<div class="space-y-4">
<!-- Item: Shopping -->
<div class="bg-surface-container-lowest rounded-xl p-card-padding shadow-ambient flex items-center">
<div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center mr-4 shrink-0">
<span class="material-symbols-outlined fill">shopping_cart</span>
</div>
<div class="flex-grow min-w-0">
<div class="text-body-lg font-body-lg text-on-surface truncate font-medium">Groceries</div>
<div class="text-body-sm font-body-sm text-on-surface-variant truncate">Bank Account</div>
</div>
<div class="text-numeric-data font-numeric-data text-secondary ml-4 shrink-0 whitespace-nowrap">
                            -$45.00
                        </div>
</div>
</div>
</div>
<!-- Date Group: Yesterday -->
<div>
<div class="flex justify-between items-end mb-4 border-b border-surface-container-highest pb-2">
<h2 class="text-label-caps font-label-caps text-on-surface-variant tracking-widest uppercase">Yesterday</h2>
<span class="text-body-sm font-body-sm text-on-surface-variant">+$2,500.00</span>
</div>
<div class="space-y-4">
<!-- Item: Salary -->
<div class="bg-surface-container-lowest rounded-xl p-card-padding shadow-ambient flex items-center">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center mr-4 shrink-0">
<span class="material-symbols-outlined fill">payments</span>
</div>
<div class="flex-grow min-w-0">
<div class="text-body-lg font-body-lg text-on-surface truncate font-medium">Company Inc</div>
<div class="text-body-sm font-body-sm text-on-surface-variant truncate">Savings</div>
</div>
<div class="text-numeric-data font-numeric-data text-primary ml-4 shrink-0 whitespace-nowrap">
                            +$2,500.00
                        </div>
</div>
</div>
</div>
</div>
</main>
<!-- FAB -->
<button class="fixed bottom-[88px] right-margin-mobile md:right-margin-desktop w-14 h-14 bg-primary text-on-primary rounded-full flex items-center justify-center shadow-fab hover:scale-105 transition-transform z-40 active:scale-95" onclick="location.href='/add-transaction'">
<span class="material-symbols-outlined" style="font-size: 28px;">add</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-safe h-16 bg-surface/80 backdrop-blur-md shadow-lg md:hidden">
<!-- Active Tab: Records -->
<button class="flex flex-col items-center justify-center text-primary after:content-[''] after:w-1 after:h-1 after:bg-primary after:rounded-full after:mt-1 flex-1 py-1 scale-90 transition-all duration-150">
<span class="material-symbols-outlined fill mb-1" data-icon="receipt_long">receipt_long</span>
<span class="text-label-caps font-label-caps">Records</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary flex-1 py-1">
<span class="material-symbols-outlined mb-1" data-icon="insert_chart">insert_chart</span>
<span class="text-label-caps font-label-caps">Analysis</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary flex-1 py-1">
<span class="material-symbols-outlined mb-1" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="text-label-caps font-label-caps">Budgets</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary flex-1 py-1">
<span class="material-symbols-outlined mb-1" data-icon="account_balance">account_balance</span>
<span class="text-label-caps font-label-caps">Accounts</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary flex-1 py-1">
<span class="material-symbols-outlined mb-1" data-icon="category">category</span>
<span class="text-label-caps font-label-caps">Categories</span>
</button>
</nav>


</body></html>
